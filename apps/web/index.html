<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let choice;
        try {
          choice = localStorage.getItem("ho.theme");
        } catch {}
        const theme =
          choice === "light" || choice === "dark"
            ? choice
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#111417" : "#ffffff";
      })();
    </script>
    <style>
      html {
        background: #f5f6f7;
        color: #171a1d;
      }
      html[data-theme="dark"] {
        background: #111417;
        color: #f2f4f6;
      }
    </style>
    <link rel="icon" href="/brand/harvest-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/harvest-logo.png" />
    <title>Harvest Outlook</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Harvest Outlook needs JavaScript to run.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
