<!doctype html>
<html lang="en" data-theme="dark" style="color-scheme: dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14251b" />
    <meta name="color-scheme" content="dark" />
    <script>
      // Apply before the application module or stylesheet: old light preferences never flash on screen.
      document.documentElement.dataset.theme = "dark";
      document.documentElement.style.colorScheme = "dark";
    </script>
    <style>
      html {
        background: #14251b;
        color: #f2f6e9;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" href="/brand/harvest-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/harvest-logo.png" />
    <title>Harvest Outlook</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Harvest Outlook needs JavaScript to run.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
