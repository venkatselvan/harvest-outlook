name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harvest
          POSTGRES_PASSWORD: harvest_ci
          POSTGRES_DB: harvest_outlook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U harvest" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://harvest:harvest_ci@localhost:5432/harvest_outlook_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @harvest/web build
      - name: Python analytics tests
        run: |
          python -m pip install -e 'analytics[dev]'
          python -m pytest analytics/tests -q
