# Local PostgreSQL with PostGIS for fresh checkouts. PostGIS is optional for the app:
# the migrations enable it only when available, and no code path requires it.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: harvest
      POSTGRES_PASSWORD: harvest_local_only
      POSTGRES_DB: harvest_outlook_dev
    ports:
      - "5432:5432"
    volumes:
      - harvest_pgdata:/var/lib/postgresql/data
      - ./scripts/dev/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvest -d harvest_outlook_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  harvest_pgdata:
